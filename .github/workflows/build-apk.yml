name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

          if [ -z "$JAVA_HOME" ]; then
            echo "::error::JAVA_HOME is not set."
            exit 1
          fi

          RAW_VERSION=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected raw Java version: $RAW_VERSION"

          if [ -z "$RAW_VERSION" ]; then
            echo "::error::Active Java version could not be detected."
            exit 1
          fi

          MAJOR_VERSION=$(echo "$RAW_VERSION" | awk -F. '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java major version: $MAJOR_VERSION"

          if [ -z "$MAJOR_VERSION" ] || ! [[ "$MAJOR_VERSION" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '$RAW_VERSION'."
            exit 1
          fi

          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "::error::Active Java major version ($MAJOR_VERSION) is lower than 17."
            exit 1
          fi

          echo "Java environment verified: Version $MAJOR_VERSION (>= 17)."

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          KEYSTORE_PATH="./debug.keystore"

          if [ -f "$KEYSTORE_PATH" ]; then
            echo "Existing debug keystore detected at $KEYSTORE_PATH. Generation skipped."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"

            if [ ! -f "$KEYSTORE_PATH" ]; then
              echo "::error::Failed to create temporary debug keystore at $KEYSTORE_PATH."
              exit 1
            fi
            echo "Temporary debug keystore successfully generated."
          fi

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          echo "=== Verifying Built APK ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Scanning app/build/outputs/apk for available APK files..."
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::The generated APK file at $EXPECTED_APK is empty."
            exit 1
          fi

          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::File $EXPECTED_APK does not have a .apk extension."
            exit 1
          fi

          echo "APK successfully verified:"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"

          TEMP_ASSET_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TEMP_ASSET_DIR"

          ASSET_FILENAME="app-debug.apk"
          TARGET_ASSET_PATH="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$SOURCE_APK" "$TARGET_ASSET_PATH"

          if [ ! -f "$TARGET_ASSET_PATH" ] || [ ! -s "$TARGET_ASSET_PATH" ]; then
            echo "::error::Failed to copy and prepare release asset at $TARGET_ASSET_PATH."
            exit 1
          fi

          echo "Release asset prepared: $TARGET_ASSET_PATH"
          ls -lh "$TARGET_ASSET_PATH"

          echo "asset_path=${TARGET_ASSET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing APK to GitHub Releases ==="
          gh --version || { echo "::error::GitHub CLI is not available."; exit 1; }

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Release asset file is missing or empty: $ASSET_PATH"
            exit 1
          fi

          if [[ "$ASSET_NAME" != "app-debug.apk" ]]; then
            echo "::error::Release asset filename must be exactly app-debug.apk, got '$ASSET_NAME'"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "Target tag: $RELEASE_TAG"
          echo "Target title: $RELEASE_TITLE"
          echo "Target asset: $ASSET_PATH ($ASSET_NAME)"

          RELEASE_NOTES=$(cat <<EOF
          ### JARVIS V1 — Debug APK Build

          * **Build Type:** Automatically generated debug APK
          * **Builder:** GitHub Actions
          * **Run Number:** #${{ github.run_number }}
          * **Run Attempt:** ${{ github.run_attempt }}
          * **Source Commit:** \`${{ github.sha }}\`
          * **Direct Asset:** \`${ASSET_NAME}\`

          > **Notice:** This APK is intended for testing and development diagnostics. It is not a Play Store production release and is signed only with a temporary Android debug keystore.
          EOF
          )

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "Release creation command completed successfully."
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Workflow Execution Summary ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            DIRECT_APK_URL="https://github.com/${{ github.repository }}/releases/latest/download/app-debug.apk"

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Filename: app-debug.apk"
            echo "Direct APK URL: $DIRECT_APK_URL"

            {
              echo "## 🚀 JARVIS V1 — Debug APK Build & Release Summary"
              echo ""
              echo "### ✅ Build & Publish Succeeded"
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** Debug APK Build #${{ github.run_number }}"
              echo "- **Release Page:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Filename:** \`app-debug.apk\`"
              echo ""
              echo "### 📱 DIRECT APK DOWNLOAD"
              echo "[$DIRECT_APK_URL]($DIRECT_APK_URL)"
              echo ""
              echo "📦 **Backup Artifact:**"
              echo "The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing did not succeed (outcome: $RELEASE_OUTCOME)."
            echo "The APK build and Actions artifact upload succeeded."
            echo "Artifact name: app-debug-apk"

            {
              echo "## ⚠️ JARVIS V1 — Debug APK Build Summary"
              echo ""
              echo "### ✅ APK Build Succeeded"
              echo "The debug APK was built successfully."
              echo ""
              echo "### 📦 Download via Actions Artifact"
              echo "GitHub Release publishing was skipped or encountered an error, but the GitHub Actions artifact **\`app-debug-apk\`** was uploaded successfully and is ready for download in this workflow run's Summary section."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
